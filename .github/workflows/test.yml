name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Must match src/test/resources/application-test.properties (env vars
      # outrank profile properties in Spring, so a mismatch 401s every auth test).
      ADMIN_PASSWORD: testpassword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn test
