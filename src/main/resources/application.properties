# Admin Authentication (HTTP Basic Auth — protects BOTH /admin/** and /api/v1/admin/**).
# Credentials are read directly from the environment by SecurityConfig
# (ADMIN_USERNAME defaults to "admin"; ADMIN_PASSWORD is required). They are intentionally
# NOT redeclared here — a self-referential `ADMIN_USERNAME=${ADMIN_USERNAME:admin}` causes a
# circular-placeholder failure at startup when the env var is unset.

# Virtual threads (Java 21 / Loom): this mock's hot path is "sleep then respond", so
# blocking Thread.sleep on a virtual thread unmounts its carrier and lets the server
# hold tens of thousands of in-flight delayed requests on a handful of OS threads.
spring.threads.virtual.enabled=true

# Mock Server Configuration
mock-server.default-min-delay=10
mock-server.default-max-delay=100
mock-server.default-error-rate=0.0
mock-server.stats-log-interval-ms=10000

# Request history (per-endpoint, for debugging). Off by default — it allocates a record
# (with a header copy) per request, which is pure overhead on a high-TPS load target.
mock-server.history.enabled=false

# Live dashboard: UI at /dashboard, ingestion API for the load-test client.
# When DASHBOARD_API_KEY is set, ingestion POSTs require a matching X-API-Key header.
dashboard.api-key=${DASHBOARD_API_KEY:}
dashboard.max-runs=100
# Optional: persist finished runs to a flat JSON file so they survive a restart (not a database).
dashboard.persist=false
dashboard.persist-file=./dashboard-runs.json

# Record/replay proxy: when enabled, requests to unconfigured paths are forwarded to the upstream
# and (when record=true) captured as mock endpoints so later requests replay them.
mock-server.proxy.enabled=false
mock-server.proxy.upstream-url=
mock-server.proxy.record=true

# Configuration persistence — single mechanism, owned by MockEndpointService.
# When enabled, configs are loaded on startup and auto-saved on every change, and the
# /admin/persistence/* endpoints can save/reload on demand.
mock-server.persistence.enabled=false
mock-server.persistence.file-path=./mock-server-config.json

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=mock-http-server

# Info endpoint
info.app.name=Mock HTTP Server
info.app.description=Configurable mock HTTP server for load testing
info.app.version=1.0.0
