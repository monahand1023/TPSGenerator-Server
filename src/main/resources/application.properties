# Admin Authentication (HTTP Basic Auth for /api/v1/admin/**)
ADMIN_USERNAME=${ADMIN_USERNAME:admin}
ADMIN_PASSWORD=${ADMIN_PASSWORD:}

# Mock Server Configuration
mock-server.default-min-delay=10
mock-server.default-max-delay=100
mock-server.default-error-rate=0.0
mock-server.stats-log-interval-ms=10000

# Configuration Persistence (legacy file-based via ConfigurationPersistenceService)
mock-server.persistence.enabled=false
mock-server.persistence.file-path=./mock-server-config.json

# Inline persistence: file path for MockEndpointService auto-save/load
mock.config.file=mock-endpoints.json

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=mock-http-server

# Info endpoint
info.app.name=Mock HTTP Server
info.app.description=Configurable mock HTTP server for load testing
info.app.version=1.0.0
